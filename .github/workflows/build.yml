name: Build PrimeSMP Scoreboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -name pom.xml -print

      - name: Build plugin
        run: mvn -B -f pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrimeSMP-Scoreboard-v2
          path: target/PrimeSMP-Scoreboard-v2.jar
